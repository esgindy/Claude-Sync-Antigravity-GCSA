<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>GCSA · Claude Sync Antigravity v4</title>
<link rel="icon" type="image/webp" href="/logo/gcsa?v=4">
<link rel="shortcut icon" type="image/webp" href="/logo/gcsa?v=4">
<style>
:root{--bg:#070912;--card:#121624;--ink:#e9ecf3;--muted:#8d95a6;--line:#262c3a;--claude:#d97757;--agy:#3d8bff;--ok:#2fbf71;--warn:#f1b84b;--bad:#e5534b}
:root.light{--bg:#f4f6fb;--card:#ffffff;--ink:#16181d;--muted:#5d6575;--line:#e1e5ee}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 "Segoe UI",Tahoma,sans-serif}
header{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding:14px 22px}h1{font-size:19px;margin:0}.sub{color:var(--muted);font-size:12.5px}
.brand{display:flex;align-items:center;gap:11px;min-width:0}
.brand-ic{width:42px;height:42px;border-radius:11px;object-fit:cover;flex:none;box-shadow:0 2px 12px #0006;border:1px solid var(--line)}
.ctl{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
select,.btn{background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:5px 8px;font:inherit;cursor:pointer}
.wrap{max-width:1360px;margin:auto;padding:0 18px 8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px}
.bridge{position:relative;height:270px;margin-bottom:14px;overflow:hidden;background:radial-gradient(ellipse at center,#141a33,#05060c);border-color:#2a3150;color:#e9ecf3}
.bridge canvas,.bridge svg.fibers{position:absolute;inset:0;width:100%;height:100%}
.hub{position:absolute;top:50%;width:150px;text-align:center;margin-top:-78px}
.hub.c{right:5%;animation:floatA 7s ease-in-out infinite;--glow:#d9775799}.hub.a{left:5%;animation:floatB 8s ease-in-out infinite;--glow:#3d8bff99}
.hub .ic{width:100px;height:100px;margin:auto;display:grid;place-items:center;filter:drop-shadow(0 0 18px var(--glow))}
.hub .ic img,.hub .ic svg{width:100px;height:100px;object-fit:contain}
.hub b{display:block;margin-top:4px}.hub span{font-size:12px;color:#9aa3b6}
@keyframes floatA{0%,100%{transform:translate(0,0) rotate(-4deg)}50%{transform:translate(-6px,-14px) rotate(4deg)}}
@keyframes floatB{0%,100%{transform:translate(0,0) rotate(3deg)}50%{transform:translate(8px,12px) rotate(-5deg)}}
.fiber{fill:none;stroke-width:1.6;opacity:.28;transition:opacity .3s}
.pulse{fill:none;stroke-width:4;stroke-linecap:round;filter:drop-shadow(0 0 7px currentColor)}
.toast{position:absolute;left:50%;transform:translateX(-50%);bottom:12px;background:#000a;border:1px solid #2a3150;padding:6px 14px;border-radius:20px;font-size:12.5px;white-space:nowrap;max-width:90%;overflow:hidden;text-overflow:ellipsis}
.stats{position:absolute;top:10px;left:50%;transform:translateX(-50%);font-size:12px;color:#9aa3b6;white-space:nowrap}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(310px,100%),1fr));gap:12px}
.agent .top{display:flex;gap:12px}.av{flex:none;width:62px;height:62px}.av svg{width:100%;height:100%}
.av.off{filter:grayscale(1);opacity:.4}
.working{animation:bob 1.2s ease-in-out infinite}@keyframes bob{50%{transform:translateY(-4px)}}
.working .arm{transform-origin:75px 60px;animation:wave 1s ease-in-out infinite}@keyframes wave{50%{transform:rotate(-25deg)}}
.working .blink{transform-origin:50px 43px;animation:blink 3s infinite}@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
.agent h3{margin:0;font-size:15px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.tag{display:inline-block;font-size:11px;padding:1px 8px;border-radius:10px;margin-top:2px;margin-inline-end:4px}
.side{font-size:10.5px;padding:0 7px;border-radius:9px;border:1px solid currentColor}
.chief{border-color:#ffd36b88;box-shadow:0 0 0 1px #ffd36b33 inset}
.bar{height:7px;background:color-mix(in srgb,var(--line) 80%,transparent);border-radius:5px;margin:8px 0 4px;overflow:hidden}.bar i{display:block;height:100%;border-radius:5px;transition:width .6s}
.now{font-size:12.5px;color:var(--muted)}.state{font-size:11px}
ul{list-style:none;margin:8px 0 0;padding:0;max-height:210px;overflow:auto}li{display:flex;gap:8px;font-size:12.5px;padding:4px 0;border-top:1px solid var(--line)}
.dot{flex:none;margin-top:6px;width:8px;height:8px;border-radius:50%;background:#59607080}.doing .dot{background:var(--agy);box-shadow:0 0 0 3px #3d8bff33}.done .dot{background:var(--ok)}.blocked .dot{background:var(--bad)}
.done .t{color:var(--muted);text-decoration:line-through}.note{display:block;color:var(--muted);font-size:11.5px}
.msgs-full{margin-top:12px}
.cols3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:12px}@media(max-width:1000px){.cols3{grid-template-columns:1fr}}
.card h2{font-size:15px;margin:0 0 8px}.feed{max-height:260px;overflow:auto;font-size:12.5px}.feed div{padding:6px 0;border-top:1px solid var(--line)}
.ts{color:var(--muted);font-size:11px;direction:ltr;display:inline-block;margin-inline-end:6px}
.dir-c{color:var(--claude)}.dir-a{color:var(--agy)}.empty{color:var(--muted)}
code{direction:ltr;unicode-bidi:embed;font-size:12px}
.banner{border-radius:12px;padding:11px 14px;margin-bottom:12px;border:1px solid var(--line);background:var(--card);font-size:13px}
.banner[hidden]{display:none}
.banner-warn{border-color:var(--warn);border-inline-start:4px solid var(--warn);background:color-mix(in srgb,var(--warn) 13%,var(--card))}
.banner-err{border-color:var(--bad);border-inline-start:4px solid var(--bad);background:color-mix(in srgb,var(--bad) 11%,var(--card))}
.banner-head{font-weight:700;display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.err-msg{margin:7px 0 0;font:inherit;font-size:12.5px;white-space:pre-wrap;word-break:break-word;unicode-bidi:plaintext;color:var(--ink)}
.tmeta{display:flex;gap:5px;flex-wrap:wrap;margin-top:3px;align-items:center}
.pill{display:inline-block;font-size:10.5px;padding:0 6px;border-radius:8px;border:1px solid var(--line);color:var(--muted)}
.pill-tr{color:var(--agy);border-color:color-mix(in srgb,var(--agy) 45%,transparent)}
.pill-fb{color:var(--ink);border-color:color-mix(in srgb,var(--warn) 55%,transparent);background:color-mix(in srgb,var(--warn) 16%,transparent)}
.ro-warn{display:block;margin-top:4px;padding:4px 8px;border-radius:7px;font-size:11.5px;font-weight:600;color:var(--bad);background:color-mix(in srgb,var(--bad) 12%,transparent);border:1px solid color-mix(in srgb,var(--bad) 45%,transparent)}
.usage-bar{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
@media(max-width:760px){.usage-bar{grid-template-columns:1fr}}
.u-card{display:flex;flex-direction:column;gap:10px;min-width:0}
.u-head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.u-title-row{display:flex;align-items:center;gap:10px;min-width:0}
.u-ic-col{display:flex;flex-direction:column;align-items:center;gap:4px;flex:none;max-width:175px;text-align:center}
.u-ic{width:34px;height:34px;flex:none;display:grid;place-items:center}
.u-ic img,.u-ic svg{width:34px;height:34px;object-fit:contain}
.u-fresh{font-size:11px;line-height:1.25;padding:2px 7px;border-radius:8px;border:1px solid var(--line);color:var(--muted);background:color-mix(in srgb,var(--bg) 55%,var(--card));max-width:100%;overflow-wrap:anywhere}
.u-fresh.ok{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 45%,transparent);background:color-mix(in srgb,var(--ok) 12%,var(--card))}
.u-fresh.stale{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 55%,transparent);background:color-mix(in srgb,var(--warn) 14%,var(--card))}
.u-fresh.unavail{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 45%,transparent);background:color-mix(in srgb,var(--bad) 12%,var(--card))}
.u-hint{margin-top:6px;padding:6px 9px;border-radius:8px;font-size:11.5px;color:var(--muted);background:color-mix(in srgb,var(--bg) 45%,var(--card));border:1px dashed var(--line);overflow-wrap:anywhere}
.u-head h2{margin:0;font-size:15px}
.u-metrics{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:480px){.u-metrics{grid-template-columns:1fr}.u-title-row{flex-wrap:wrap}.u-ic-col{max-width:100%;align-items:flex-start;text-align:start}}
.u-box{border:1px solid var(--line);border-radius:10px;padding:9px 10px;background:color-mix(in srgb,var(--bg) 45%,var(--card))}
.u-row{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:12.5px}
.u-val{font-weight:700;direction:ltr;unicode-bidi:embed}
.u-muted{color:var(--muted);font-size:11.5px}
.bar-sm{height:6px;margin:6px 0 2px}
.u-meta-line{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:8px}
.u-note{margin-top:6px;font-size:12px;color:var(--muted);overflow-wrap:anywhere}
.agy-dd{border:1px solid var(--line);border-radius:10px;background:color-mix(in srgb,var(--bg) 40%,var(--card));overflow:hidden}
.agy-sum{list-style:none;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 12px;flex-wrap:wrap;user-select:none}
.agy-sum::-webkit-details-marker{display:none}
.agy-sum-main{display:flex;align-items:center;gap:8px;flex-wrap:wrap;min-width:0;flex:1}
.agy-sum-end{display:flex;align-items:center;gap:8px;flex:none}
.chev{display:inline-block;transition:transform .2s;color:var(--muted);font-size:12px}
#agyModelsDd[open] .chev{transform:rotate(180deg)}
.agy-list{border-top:1px solid var(--line);max-height:280px;overflow:auto;padding:6px 10px}
.m-row{padding:8px 2px;border-top:1px solid var(--line);font-size:12.5px}
.m-row:first-child{border-top:0}
.m-top{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.m-name{display:flex;align-items:center;gap:6px;flex-wrap:wrap;min-width:0;overflow-wrap:anywhere}
.m-stats{display:flex;gap:12px;flex-wrap:wrap;font-size:11.5px;color:var(--muted);margin-top:4px}
footer{text-align:center;color:var(--muted);font-size:12.5px;padding:18px}footer a{color:#5f9bff;text-decoration:none}footer a:hover{text-decoration:underline}
</style></head><body>
<header><div class="brand"><img src="/logo/gcsa?v=4" alt="GCSA" class="brand-ic"><div><h1 id="title">GCSA · Claude Sync Antigravity</h1><div class="sub" id="subtitle"></div></div></div>
<div class="ctl"><span class="sub" id="clock"></span>
<button id="theme" class="btn" aria-label="theme">☀️</button>
<select id="avstyle" aria-label="avatars"><option value="char">🤖</option><option value="pixel">👾</option><option value="simple">🦊</option></select>
<select id="lang" aria-label="language"><option value="ar">العربية</option><option value="en">English</option><option value="zh">中文</option><option value="hi">हिन्दी</option><option value="es">Español</option><option value="fr">Français</option><option value="pt">Português</option><option value="ru">Русский</option></select></div></header>
<div class="wrap">
<div id="secWarn" class="banner banner-warn" role="alert" hidden></div>
<div id="trErr" class="banner banner-err" role="alert" hidden></div>
<div class="card bridge"><canvas id="space"></canvas><svg class="fibers" viewBox="0 0 1000 270" preserveAspectRatio="none" id="svg"></svg>
<div class="stats" id="stats"></div>
<div class="hub c"><div class="ic" id="hubC"></div><b>Claude</b><span data-t="brain"></span></div>
<div class="hub a"><div class="ic" id="hubA"></div><b>Antigravity</b><span data-t="muscle"></span></div>
<div class="toast" id="toast"></div></div>
<div class="grid" id="agents"></div>
<div class="card msgs-full"><h2 data-t="msgs"></h2><div class="feed" id="msgs"></div></div>
<div class="cols3">
<div class="card"><h2 data-t="log"></h2><div class="feed" id="log"></div></div>
<div class="card"><h2><span data-t="files"></span> <span class="sub" id="fcount"></span></h2><div class="feed" id="files"></div></div>
<div class="card"><h2 data-t="commits"></h2><div class="feed" id="commits"></div></div>
</div>
<section class="usage-bar" aria-label="Usage">
<div class="card u-card">
<div class="u-head"><div class="u-title-row"><div class="u-ic-col"><div class="u-ic" id="usageIconC"></div><div class="u-fresh" id="claudeFreshness"></div></div><div><h2 data-t="claudeUsageTitle"></h2><div class="sub" data-t="claudeOverall"></div></div></div><div class="sub" id="claudeUpdated"></div></div>
<div id="claudeUsageBody"></div>
</div>
<div class="card u-card">
<div class="u-head"><div class="u-title-row"><div class="u-ic" id="usageIconA"></div><div><h2>Antigravity</h2><div class="sub" id="agySummaryMeta"></div></div></div><div id="agyPlan"></div></div>
<details id="agyModelsDd" class="agy-dd"><summary class="agy-sum" id="agySum"></summary><div class="agy-list" id="agyList"></div></details>
</div>
</section>
</div>

 hydrogen:(f,c)=>`<circle cx="24" cy="23" r="9" fill="${c}"/><circle cx="76" cy="23" r="9" fill="${c}"/><rect x="31" y="13" width="17" height="10" rx="5" fill="#0e1424" stroke="#7ef9ff" stroke-width="2"/><rect x="52" y="13" width="17" height="10" rx="5" fill="#0e1424" stroke="#7ef9ff" stroke-width="2"/>`,
 flash:()=>`<polygon points="22,30 8,12 36,19" fill="#ffd36b"/><polygon points="78,30 92,12 64,19" fill="#ffd36b"/><path d="M53 1 L43 14 L50 14 L46 24 L58 10 L51 10 Z" fill="#ffd36b"/>`,
 gpt:(f,c)=>`<polygon points="24,28 20,12 35,20" fill="${c}"/><polygon points="76,28 80,12 65,20" fill="${c}"/><circle cx="50" cy="10" r="4" fill="#7ef9ff"/>`};
const SIMPLE=f=>{const [col,face]=FAM[f],ears=(CHIBI_EARS[f]||CHIBI_EARS.gpt)(face,col);
 const ef=f==='opus'?'<circle cx="39" cy="43" r="8.5" fill="none" stroke="#ffd36b" stroke-width="2.2"/><circle cx="61" cy="43" r="8.5" fill="none" stroke="#ffd36b" stroke-width="2.2"/><line x1="47.5" y1="43" x2="52.5" y2="43" stroke="#ffd36b" stroke-width="2"/>':f==='neon'?'<rect x="27" y="36" width="46" height="12" rx="6" fill="#7ef9ff" opacity=".28" stroke="#7ef9ff" stroke-width="1.5"/>':'';
 const ch=f==='gindy'?'<polygon points="44,64 50,71 56,64" fill="#fff"/><path d="M47 68 L50 64 L53 68 L50 86 Z" fill="#c92a2a"/>':`<path d="M42 65 L50 73 L58 65" fill="none" stroke="#fff8" stroke-width="2.5" stroke-linecap="round"/><circle cx="50" cy="77" r="4.5" fill="${face}"/>`;
 return `<svg viewBox="0 0 100 100">${ears}<ellipse cx="50" cy="42" rx="29" ry="24" fill="${col}"/><ellipse cx="50" cy="45" rx="23" ry="18.5" fill="#fffaf2"/><ellipse cx="32" cy="49" rx="4.2" ry="2.4" fill="#ff7a8a" opacity=".55"/><ellipse cx="68" cy="49" rx="4.2" ry="2.4" fill="#ff7a8a" opacity=".55"/><g class="blink"><ellipse cx="39" cy="43" rx="5.2" ry="5.8" fill="#141928"/><circle cx="37.2" cy="40.8" r="2" fill="#fff"/><circle cx="40.8" cy="45" r="1.1" fill="${col}"/><ellipse cx="61" cy="43" rx="5.2" ry="5.8" fill="#141928"/><circle cx="59.2" cy="40.8" r="2" fill="#fff"/><circle cx="62.8" cy="45" r="1.1" fill="${col}"/></g>${ef}<polygon points="48,48 52,48 50,50.5" fill="#3b2a22"/><path d="M43 53 Q50 60 57 53 Z" fill="#e5534b"/><path d="M43 53 Q50 58 57 53" fill="none" stroke="#231815" stroke-width="2" stroke-linecap="round"/><path d="M30 88 C30 67 36 63 50 63 C64 63 70 67 70 88 Z" fill="${col}"/>${ch}<ellipse cx="24" cy="74" rx="6" ry="8" fill="${col}"/><g class="arm"><ellipse cx="77" cy="64" rx="6" ry="9" transform="rotate(-18 77 64)" fill="${col}"/><circle cx="79" cy="58" r="3.5" fill="#fffaf2"/></g></svg>`};
const avatar=f=>avStyle==='pixel'?pixelAv(f):avStyle==='simple'?SIMPLE(f):charAv(f);
// hubs: real logos (char/simple) or pixel characters
const PIX_CLAUDE=pix(['..OOOOOOOOOOOO..','.OOOOOOOOOOOOOO.','OOOOOOOWWOOOOOOO','OOOOOOOWWOOOOOOO','OOOWOOOWWOOOWOOO','OOOOWOOWWOOWOOOO','OOOOOWWWWWWOOOOO','OOWWWWWWWWWWWWOO','OOWWWWWWWWWWWWOO','OOOOOWWWWWWOOOOO','OOOOWOOWWOOWOOOO','OOOWOOOWWOOOWOOO','OOOOOOOWWOOOOOOO','OOOOOOOWWOOOOOOO','.OOOOOOOOOOOOOO.','..OOOOOOOOOOOO..'],{O:'#d97757',W:'#fff'});
const PIX_AGY=pix(['................','.......YR.......','......YRRR......','.....GYYRRP.....','.....GGYRRP.....','....GGG..PPP....','....GGB..BPP....','...GBBB..BBBP...','...BBBB..BBBB...','..BBBBBBBBBBBB..','..BBBB....BBBB..','.BBBB......BBBB.','.BBB........BBB.','BBB..........BBB','BB............BB','................'],{Y:'#f5c242',R:'#ef5a3c',G:'#57b65f',P:'#8e78d6',B:'#3d8bff'});
function renderHubIcon(el,which){if(!el)return;const isC=which==='claude',fb=isC?PIX_CLAUDE:PIX_AGY;if(avStyle==='pixel'){el.innerHTML=fb;return}
 el.innerHTML=`<img src="${isC?'/logo/claude':'/logo/antigravity'}" alt="${isC?'Claude':'Antigravity'}">`;
 const im=el.querySelector('img');im.onerror=()=>{el.innerHTML=fb}}
function renderHubs(){renderHubIcon($('hubC'),'claude');renderHubIcon($('hubA'),'antigravity');renderHubIcon($('usageIconC'),'claude');renderHubIcon($('usageIconA'),'antigravity')}

// ---------- data -> view ----------
const setHtml=(el,html)=>{if(!el||el.dataset.prev===html)return;const sc=el.scrollTop;el.innerHTML=html;el.dataset.prev=html;el.scrollTop=sc};
const pctColor=p=>p==null?'var(--muted)':p>=50?'var(--ok)':p>=20?'var(--warn)':'var(--bad)';
const fmtNum=n=>Number(n||0).toLocaleString('en-US');
function fmtReset(v){if(v==null||v==='')return T('unavailable');const s=String(v).trim();
 if(/^\d{4}-\d{2}-\d{2}T/.test(s)){const d=new Date(s);if(!Number.isNaN(d.getTime())){try{return d.toLocaleString(lang==='ar'?'ar-EG':lang,{month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'})}catch{}}}
 return s}
function renderBanners(){
 const sw=$('secWarn');
 if(data.security?.auto_exec_warning){sw.hidden=false;setHtml(sw,`<div class="banner-head"><span>⚠️ ${esc(T('autoExecWarn'))}</span></div>`)}
 else{sw.hidden=true;setHtml(sw,'')}
 const te=$('trErr'),err=data.transportState?.last_error;
 if(err){
  const msg=typeof err==='string'?err:(err.message||JSON.stringify(err));
  const ts=err?.ts?`<span class="ts">${time(err.ts)}</span>`:'';
  te.hidden=false;setHtml(te,`<div class="banner-head"><span>⛔ ${esc(T('noTransportTitle'))}</span>${ts}</div><pre class="err-msg">${esc(msg)}</pre>`);
 }else{te.hidden=true;setHtml(te,'')}
}
function renderUsage(){
 const cu=data.claude_usage||data.claudeUsage||null;
 const h5=(cu&&typeof cu.five_hour_remaining_pct==='number'&&Number.isFinite(cu.five_hour_remaining_pct))?cu.five_hour_remaining_pct:null;
 const wk=(cu&&typeof cu.weekly_remaining_pct==='number'&&Number.isFinite(cu.weekly_remaining_pct))?cu.weekly_remaining_pct:null;
 const hasClaudeData=h5!==null||wk!==null;
 const isStale=Boolean(cu?.stale);
 const nowTs=Date.parse(data.now||new Date().toISOString())||Date.now();
 const updTs=cu?.updated_at?Date.parse(cu.updated_at):NaN;
 const minsAgo=!Number.isNaN(updTs)?Math.max(0,Math.floor((nowTs-updTs)/60000)):(typeof cu?.age_s==='number'?Math.max(0,Math.floor(cu.age_s/60)):0);
 const reasonTxt=(!cu?.reason||cu?.reason_code==='no_data')?T('unavailNoData'):cu.reason;
 let freshLabel='',freshCls='u-fresh';
 if(hasClaudeData&&!isStale){
  freshLabel=T('updatedMinAgo').replace('{n}',String(minsAgo));
  freshCls='u-fresh ok';
 }else if(hasClaudeData&&isStale){
  freshLabel=`${T('stale')} · ${T('updatedMinAgo').replace('{n}',String(minsAgo))}`;
  freshCls='u-fresh stale';
 }else{
  freshLabel=`${T('unavailable')}: ${reasonTxt}`;
  freshCls='u-fresh unavail';
 }
 const cfEl=$('claudeFreshness');
 if(cfEl){cfEl.className=freshCls;cfEl.textContent=freshLabel;cfEl.title=cu?.reason||freshLabel}
 const box=(lbl,pct)=>{const fill=pct!==null?Math.max(0,Math.min(100,pct)):0;const col=pctColor(pct);
  return `<div class="u-box"><div class="u-row"><span>${esc(lbl)}</span><span class="u-val">${esc(pct!==null?pct+'%':T('unavailable'))}</span></div><div class="bar bar-sm"><i style="width:${fill}%;background:${col}"></i></div></div>`};
 const hintHtml=(!hasClaudeData||isStale)?`<div class="u-hint"><b>${esc(isStale?T('stale'):T('unavailable'))}:</b> ${esc(reasonTxt)}<br>${esc(T('usageHint'))}</div>`:'';
 const cBody=`<div class="u-metrics">${box(T('fiveHourLeft'),h5)}${box(T('weeklyLeft'),wk)}</div>`
  +`<div class="u-meta-line"><span>${esc(T('resetsAt'))}: <b>${esc(fmtReset(cu?.resets_at))}</b></span></div>`
  +(cu?.note?`<div class="u-note">${esc(T('noteLabel'))}: ${esc(cu.note)}</div>`:'')
  +hintHtml;
 setHtml($('claudeUsageBody'),cBody);
 $('claudeUpdated').textContent=cu?.updated_at?`${freshLabel} (${time(cu.updated_at)})`:freshLabel;

 const au=data.antigravityUsage||{},models=Array.isArray(au.models)?au.models:[],top=au.top_model||null;
 $('agySummaryMeta').textContent=`${T('todayTokens')}: ${fmtNum(au.today_tokens)} · ${T('totalTokens')}: ${fmtNum(au.all_time_tokens)} · ${T('jobsCount')}: ${fmtNum(au.all_time_jobs)}`;
 setHtml($('agyPlan'),au.plan?`<span class="tag" style="background:color-mix(in srgb,var(--agy) 16%,transparent);color:var(--agy)">${esc(au.plan)}</span>`:'');
 const sumModel=top||models[0]||null;
 const sumPct=(sumModel&&typeof sumModel.remaining_pct==='number'&&Number.isFinite(sumModel.remaining_pct))?sumModel.remaining_pct:null;
 const sumHtml=top
  ?`<span class="agy-sum-main"><span class="pill pill-tr">${esc(T('topModel'))}</span> <b>${esc(top.label||top.id)}</b> <span class="sub">${fmtNum(top.today_tokens)} ${esc(T('todayTokens'))} · ${fmtNum(top.total_tokens)} ${esc(T('totalTokens'))} · ${fmtNum(top.total_jobs)} ${esc(T('jobsCount'))}</span></span><span class="agy-sum-end"><span class="u-val">${esc(sumPct!==null?sumPct+'%':T('unavailable'))}</span><span class="pill">${models.length} ${esc(T('allModels'))}</span><span class="chev" aria-hidden="true">▾</span></span>`
  :`<span class="agy-sum-main"><span class="pill">${esc(T('topModel'))}</span> <b>${esc(sumModel?(sumModel.label||sumModel.id):T('unavailable'))}</b> <span class="sub">(${esc(T('noUsageYet'))})</span></span><span class="agy-sum-end"><span class="u-val">${esc(sumPct!==null?sumPct+'%':T('unavailable'))}</span><span class="pill">${models.length} ${esc(T('allModels'))}</span><span class="chev" aria-hidden="true">▾</span></span>`;
 setHtml($('agySum'),sumHtml);
 const errNote=au.quota_error?`<div class="u-note" style="margin-bottom:6px">${esc(au.quota_error)}</div>`:'';
 const listHtml=errNote+(models.length?models.map(m=>{
  const pct=(typeof m.remaining_pct==='number'&&Number.isFinite(m.remaining_pct))?m.remaining_pct:null;
  const fill=pct!==null?Math.max(0,Math.min(100,pct)):0,col=pctColor(pct);
  const idTag=m.id&&m.id!==m.label?`<code>${esc(m.id)}</code>`:'';
  return `<div class="m-row"><div class="m-top"><span class="m-name"><b>${esc(m.label||m.id)}</b>${idTag}</span><span class="u-val">${esc(pct!==null?pct+'%':T('unavailable'))}</span></div><div class="bar bar-sm"><i style="width:${fill}%;background:${col}"></i></div><div class="m-stats"><span>${esc(T('resetsAt'))}: ${esc(fmtReset(m.resets_at))}</span><span>${esc(T('todayTokens'))}: ${fmtNum(m.today_tokens)}</span><span>${esc(T('totalTokens'))}: ${fmtNum(m.total_tokens)}</span><span>${esc(T('jobsCount'))}: ${fmtNum(m.total_jobs)}</span></div></div>`;
 }).join(''):`<div class="empty">${esc(T('noModels'))}</div>`);
 setHtml($('agyList'),listHtml);
}
function allAgents(){if(!data)return[];const s=data.status||{};const manual=(s.agents||[]).map(a=>({...a,side:a.side||(/gemini|neon|argon|flash|hydrogen|gpt/i.test(a.model||'')?'antigravity':'claude')}));
 let chief=manual.find(a=>a.id==='gindy'||a.chief);if(chief)chief.chief=true;else{chief={id:'gindy',name:'Gindy',model:'Claude',chief:true,side:'claude',tasks:[],now:''}}
 const rest=manual.filter(a=>a!==chief),auto=data.jobAgents||[];
 const isActive=a=>Boolean(a.active||(a.tasks||[]).some(t=>t.state==='doing'));
 if(!chief.tasks.length)chief.now=chief.now||`${rest.length+auto.length} ${T('agents')}`;
 const others=[...rest,...auto].map(a=>({...a,active:isActive(a)}));
 const working=others.filter(a=>a.active),inactive=others.filter(a=>!a.active);
 chief.active=isActive(chief)||working.length>0;
 return [{...chief,active:chief.active},...working,...inactive]}
function renderTask(t){
 const badges=[];
 if(t.transport)badges.push(`<span class="pill pill-tr" title="${esc(t.transport_reason||'')}">${esc(t.transport)}</span>`);
 if(t.tier)badges.push(`<span class="pill">${esc(T('tierLabel'))}: ${esc(t.tier)}</span>`);
 if(t.fallback_from)badges.push(`<span class="pill pill-fb">${esc(T('fallbackBadge'))}: ${esc(t.fallback_from)}</span>`);
 const notes=[];
 if(t.transport_reason)notes.push(`<span class="note">${esc(T('transport'))} · ${esc(T('reason'))}: ${esc(t.transport_reason)}</span>`);
 if(t.tier_reason)notes.push(`<span class="note">${esc(T('tierLabel'))} · ${esc(T('reason'))}: ${esc(t.tier_reason)}</span>`);
 if(t.fallback_reason)notes.push(`<span class="note">${esc(T('fallbackBadge'))}: ${esc(t.fallback_reason)}</span>`);
 if(t.note)notes.push(`<span class="note">${esc(t.note)}</span>`);
 const ro=t.read_only_violation?`<span class="ro-warn">⚠️ ${esc(T('readOnlyWarn'))}${t.read_only_warning?': '+esc(t.read_only_warning):''}</span>`:'';
 return `<li class="${esc(t.state)}"><span class="dot"></span><span style="min-width:0;flex:1"><span class="t">${esc(t.title)}</span>${badges.length?`<div class="tmeta">${badges.join('')}</div>`:''}${notes.join('')}${ro}</span></li>`;
}
function card(a){const tasks=a.tasks||[],n=tasks.length,d=tasks.filter(t=>t.state==='done').length,g=tasks.filter(t=>t.state==='doing').length;
 const p=n?Math.round((d+g*.5)/n*100):(a.active?50:0),f=family(a),[col]=FAM[f],fin=n&&d===n;
 const st=a.active?`<span class="state" style="color:var(--ok)">● ${T('working')}</span>`:`<span class="state" style="color:var(--muted)">● ${fin?T('finished'):T('idle')}</span>`;
 const sideCol=a.side==='antigravity'?'var(--agy)':'var(--claude)';
 const trBadge=a.transport?`<span class="pill pill-tr" title="${esc(a.transport_reason||'')}">${esc(a.transport)}</span>`:'';
 return `<div class="card agent ${a.chief?'chief':''}"><div class="top"><div class="av ${a.active?'working':'off'}">${avatar(f)}</div><div style="flex:1;min-width:0">
 <h3>${a.chief?'👑 ':''}${esc(a.name)} <span class="side" style="color:${sideCol}">${a.side==='antigravity'?'Antigravity':'Claude'}</span> ${trBadge} ${st}</h3>
 ${a.chief?`<div class="sub">${T('chief')}</div>`:''}<span class="tag" style="background:${col}22;color:${col}">${esc(a.model||'')}</span>
 <div class="bar"><i style="width:${p}%;background:${col}"></i></div><div class="now">${n?`${d}/${n} ${T('doneN')} · `:''}${esc(a.now||'')}</div></div></div>
 ${n?`<ul>${tasks.map(renderTask).join('')}</ul>`:''}</div>`}
function render(){if(!data)return;const s=data.status||{},agents=allAgents();
 const pj=s.project||'';$('title').textContent=/claude sync antigravity|\bgcsa\b/i.test(pj)?pj:`GCSA · Claude Sync Antigravity · ${pj}`;
 renderBanners();
 $('agents').innerHTML=agents.length>1||agents[0]?.tasks?.length?agents.map(card).join(''):agents.map(card).join('')+`<div class="card empty">${T('noAgents')}</div>`;
 const act=agents.filter(a=>a.active).length,tot=agents.reduce((x,a)=>x+(a.tasks||[]).length,0),dn=agents.reduce((x,a)=>x+(a.tasks||[]).filter(t=>t.state==='done').length,0);
 $('stats').textContent=`${agents.length} ${T('agents')} · ${act} ${T('active')} · ${dn}/${tot} ${T('tasks')}`;
 $('msgs').innerHTML=(data.messages||[]).map(m=>{const c=m.direction==='claude->antigravity';
  const tr=m.transport?` <span class="pill pill-tr" title="${esc(m.transport_reason||'')}">${esc(m.transport)}</span>`:'';
  const trR=m.transport_reason?` <span class="note" style="display:inline" title="${esc(m.transport_reason)}">· ${esc(m.transport_reason)}</span>`:'';
  return `<div><span class="ts">${time(m.ts)}</span><b class="${c?'dir-c':'dir-a'}">${c?T('toA'):T('toC')}</b> <span class="note" style="display:inline">${esc(m.kind)} · ${esc(m.channel)}${m.model?' · '+esc(m.model):''}</span>${tr}${trR}<br>${esc(String(m.text||'').slice(0,600))}</div>`}).join('')||`<div class="empty">${T('noMsgs')}</div>`;
 const names=Object.fromEntries(agents.map(a=>[a.id,a.name]));
 $('log').innerHTML=(s.log||[]).slice(0,120).map(l=>`<div><span class="ts">${time(l.ts)}</span><b>${esc(names[l.agent]||l.agent)}</b> ${esc(l.text)}</div>`).join('')||`<div class="empty">${T('noLog')}</div>`;
 $('fcount').textContent=`(${(data.files||[]).length})`;$('files').innerHTML=(data.files||[]).map(f=>`<div><code>${esc(f)}</code></div>`).join('');
 $('commits').innerHTML=(data.commits||[]).map(c=>`<div><span class="ts">${esc(c.time)}</span><code>${esc(c.hash)}</code> ${esc(c.subject)}</div>`).join('')||'<div class="empty">—</div>';
 renderUsage()}
let lastMsg=null;
async function tick(){let d;try{d=await (await fetch('/api/status',{cache:'no-store'})).json()}catch{$('clock').textContent=T('offline');return}
 const first=!data;data=d;$('clock').textContent=time(d.now);
 const msgs=d.messages||[];if(first){lastMsg=msgs[0]?.ts||'';if(!msgs.length)$('toast').textContent=T('wait');else $('toast').innerHTML=`${esc(String(msgs[0].text||'').slice(0,120))}`}
 else{const fresh=msgs.filter(m=>m.ts>lastMsg).reverse();fresh.slice(-4).forEach((m,i)=>setTimeout(()=>fire(m.direction==='claude->antigravity',String(m.text||'').slice(0,120)),i*700));if(msgs[0])lastMsg=msgs[0].ts}
 render()}
renderHubs();applyLang();tick();setInterval(tick,2000);
</script></body></html>
